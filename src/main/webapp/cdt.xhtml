<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Registro CDT – FarfanWebUD</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <style>
        body { background-color: #f0f4f8; }
        .form-card { border-radius: 12px; }
        .field-error { color: #dc3545; font-size: 0.86em; }
        footer { background-color: #003366; color: #fff; }
    </style>
</h:head>

<h:body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark mb-4" style="background-color:#003366;">
        <div class="container">
            <span class="navbar-brand fw-bold">FarfanWebUD</span>
            <a href="index.xhtml" class="btn btn-outline-light btn-sm">← Inicio</a>
        </div>
    </nav>

    <div class="container mb-5">
        <h1 class="text-center mb-4" style="color:#003366;">Registro de CDT</h1>

        <div class="card shadow form-card p-4 mx-auto" style="max-width:640px;">
            <h:form id="frmCDT">

                <!-- Mensaje de éxito -->
                <h:panelGroup rendered="#{not empty cdtBean.mensajeExito}">
                    <div class="alert alert-success mb-3" role="alert">
                        <h:outputText value="#{cdtBean.mensajeExito}"/>
                    </div>
                </h:panelGroup>

                <!-- Inversión -->
                <div class="mb-3">
                    <label class="form-label fw-semibold" for="inversion">
                        Inversión ($) *
                    </label>
                    <h:inputText id="inversion"
                                 value="#{cdtBean.dto.inversion}"
                                 required="true"
                                 requiredMessage="El monto de inversión es obligatorio."
                                 validatorMessage="La inversión debe ser mayor a $1."
                                 styleClass="form-control">
                        <f:convertNumber minFractionDigits="2"
                                         converterMessage="Ingresa un número válido (ej: 5000000)."/>
                        <f:validateDoubleRange minimum="1"/>
                    </h:inputText>
                    <h:message for="inversion" styleClass="field-error"/>
                    <small class="text-muted">Ejemplo: 5000000</small>
                </div>

                <!-- Tasa de interés -->
                <div class="mb-3">
                    <label class="form-label fw-semibold" for="interes">
                        Tasa de interés anual *
                    </label>
                    <h:inputText id="interes"
                                 value="#{cdtBean.dto.interes}"
                                 required="true"
                                 requiredMessage="La tasa de interés es obligatoria."
                                 validatorMessage="La tasa debe estar entre 0.001 y 1.0."
                                 styleClass="form-control">
                        <f:convertNumber minFractionDigits="4"
                                         converterMessage="Ingresa un número válido (ej: 0.08)."/>
                        <f:validateDoubleRange minimum="0.001" maximum="1.0"/>
                    </h:inputText>
                    <h:message for="interes" styleClass="field-error"/>
                    <small class="text-muted">Ejemplo: 0.08 = 8% anual</small>
                </div>

                <!-- Plazo -->
                <div class="mb-4">
                    <label class="form-label fw-semibold" for="plazo">
                        Plazo (días) *
                    </label>
                    <h:inputText id="plazo"
                                 value="#{cdtBean.dto.plazo}"
                                 required="true"
                                 requiredMessage="El plazo en días es obligatorio."
                                 validatorMessage="El plazo debe estar entre 30 y 1800 días."
                                 styleClass="form-control">
                        <f:convertNumber integerOnly="true"
                                         converterMessage="Ingresa un número entero (ej: 180)."/>
                        <f:validateDoubleRange minimum="30" maximum="1800"/>
                    </h:inputText>
                    <h:message for="plazo" styleClass="field-error"/>
                    <small class="text-muted">Entre 30 y 1800 días. Ejemplo: 180</small>
                </div>

                <!-- Botón registrar -->
                <div class="d-grid">
                    <h:commandButton value="Calcular y Registrar"
                                     action="#{cdtBean.registrar}"
                                     styleClass="btn btn-primary btn-lg">
                        <f:ajax execute="@form" render="@form"/>
                    </h:commandButton>
                </div>

            </h:form>
        </div>

        <!-- Enlace a vista admin CDT -->
        <div class="text-center mt-4">
            <a href="cdtAdmin.xhtml" class="btn btn-outline-success">
                Ver listado de CDTs registrados
            </a>
        </div>
    </div>

    <!-- Footer -->
    <footer class="py-3 text-center">
        <p class="mb-0 small">
            Erick Mauricio Farfán Díaz · Cód. 20241578110 · Asignatura 578-302 ·
            Universidad Distrital Francisco José de Caldas · 2026
        </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</h:body>
</html>
